name: RouteRelay tests
on:
  push:
    paths:
      - "routerelay-transit-operations/**"
      - ".github/workflows/routerelay-tests.yml"
  pull_request:
    paths:
      - "routerelay-transit-operations/**"
      - ".github/workflows/routerelay-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routerelay-transit-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
