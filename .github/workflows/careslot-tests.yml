name: CareSlot CI
on:
  push:
    paths:
      - "careslot-clinic-scheduler/**"
      - ".github/workflows/careslot-tests.yml"
  pull_request:
    paths:
      - "careslot-clinic-scheduler/**"
      - ".github/workflows/careslot-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careslot-clinic-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
